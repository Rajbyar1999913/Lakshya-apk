name: Build and Release Lakshya APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.LAKSHYA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/lakshya.keystore
          test -s app/lakshya.keystore
          echo "Signing keystore created successfully."

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        env:
          LAKSHYA_KEYSTORE_PASSWORD: ${{ secrets.LAKSHYA_KEYSTORE_PASSWORD }}
          LAKSHYA_KEY_PASSWORD: ${{ secrets.LAKSHYA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Read App Version
        id: version
        shell: bash
        run: |
          VERSION_CODE=$(sed -nE 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)

          VERSION_NAME=$(sed -nE 's/.*versionName[[:space:]]*=[[:space:]]*["'\'']([^"'\'']+)["'\''].*/\1/p' app/build.gradle.kts | head -n 1)

          if [ -z "$VERSION_CODE" ] || [ -z "$VERSION_NAME" ]; then
            echo "Could not read app version."
            exit 1
          fi

          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

          echo "Version Code: $VERSION_CODE"
          echo "Version Name: $VERSION_NAME"

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          VERSION_CODE="${{ steps.version.outputs.version_code }}"
          TAG="v${VERSION_NAME}"

          APK="app/build/outputs/apk/release/app-release.apk"

          echo "=========================================="
          echo "Lakshya Release"
          echo "Tag         : ${TAG}"
          echo "Version Code: ${VERSION_CODE}"
          echo "Version Name: ${VERSION_NAME}"
          echo "APK         : ${APK}"
          echo "=========================================="

          if gh release view "$TAG" >/dev/null 2>&1; then

            echo "Release ${TAG} already exists."
            echo "Updating existing release APK..."

            gh release upload "$TAG" \
              "$APK" \
              --clobber

            echo "Existing release ${TAG} updated successfully."

          else

            echo "Release ${TAG} does not exist."
            echo "Creating new GitHub release..."

            gh release create "$TAG" \
              "$APK" \
              --title "Lakshya ${VERSION_NAME}" \
              --notes "Automatic Lakshya release.

          versionCode: ${VERSION_CODE}
          versionName: ${VERSION_NAME}"

            echo "New release ${TAG} created successfully."

          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.LAKSHYA_FIREBASE_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Update Firestore App Config
        shell: bash
        env:
          PROJECT_ID: lakshya-9f19f
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |

          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION_NAME}/app-release.apk"

          ACCESS_TOKEN="$(gcloud auth print-access-token)"

          cat > firestore-update.json <<EOF
          {
            "fields": {
              "latestVersionCode": {
                "integerValue": "${VERSION_CODE}"
              },
              "minimumVersionCode": {
                "integerValue": "${VERSION_CODE}"
              },
              "forceUpdate": {
                "booleanValue": true
              },
              "updateMessage": {
                "stringValue": "Lakshya ${VERSION_NAME} is available. Please update now."
              },
              "updateUrl": {
                "stringValue": "${APK_URL}"
              },
              "appEnabled": {
                "booleanValue": true
              },
              "loginEnabled": {
                "booleanValue": true
              },
              "printEnabled": {
                "booleanValue": true
              }
            }
          }
          EOF

          curl --fail-with-body \
            --request PATCH \
            "https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/app_config/main?updateMask.fieldPaths=latestVersionCode&updateMask.fieldPaths=minimumVersionCode&updateMask.fieldPaths=forceUpdate&updateMask.fieldPaths=updateMessage&updateMask.fieldPaths=updateUrl&updateMask.fieldPaths=appEnabled&updateMask.fieldPaths=loginEnabled&updateMask.fieldPaths=printEnabled" \
            --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data @firestore-update.json

          echo ""
          echo "=========================================="
          echo "Firebase App Config Updated Successfully"
          echo "Version Code : ${VERSION_CODE}"
          echo "Version Name : ${VERSION_NAME}"
          echo "APK URL      : ${APK_URL}"
          echo "=========================================="

      - name: Remove temporary signing keystore
        if: always()
        run: rm -f app/lakshya.keystore