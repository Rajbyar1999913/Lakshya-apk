name: Build and Release Lakshya APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.LAKSHYA_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/lakshya.keystore
          test -s app/lakshya.keystore
          echo "Signing keystore created successfully."

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        env:
          LAKSHYA_KEYSTORE_PASSWORD: ${{ secrets.LAKSHYA_KEYSTORE_PASSWORD }}
          LAKSHYA_KEY_PASSWORD: ${{ secrets.LAKSHYA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Read App Version
        id: version
        shell: bash
        run: |
          VERSION_CODE=$(sed -nE 's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n 1)
          VERSION_NAME=$(sed -nE 's/.*versionName[[:space:]]*=[[:space:]]*["'\'']([^"'\'']+)["'\''].*/\1/p' app/build.gradle.kts | head -n 1)

          if [ -z "$VERSION_CODE" ] || [ -z "$VERSION_NAME" ]; then
            echo "Could not read app version."
            exit 1
          fi

          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          VERSION_CODE="${{ steps.version.outputs.version_code }}"
          TAG="v${VERSION_NAME}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 1
          fi

          gh release create "$TAG" \
            app/build/outputs/apk/release/app-release.apk \
            --title "Lakshya ${VERSION_NAME}" \
            --notes "Automatic Lakshya release.

          versionCode: ${VERSION_CODE}
          versionName: ${VERSION_NAME}"

      - name: Remove temporary signing keystore
        if: always()
        run: rm -f app/lakshya.keystore